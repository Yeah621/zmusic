<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#eef8f5;--sf:#fff;--tx:#09130f;--mut:#44605a;--ac:#2de3b2;--ac2:#0fb48a;--acx:#046c52;--on:#032;--gl:rgba(255,255,255,.7);--bd:rgba(9,19,15,.12);--hv:rgba(9,19,15,.06);--er:#d6245c;color-scheme:light}

html,body{height:100%}
body{font:400 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;transition:background .5s,color .5s}
a{color:inherit;text-decoration:none}

:focus-visible{outline:2px solid var(--acx);outline-offset:2px}
[data-theme=dark] :focus-visible{outline-color:var(--ac)}
#vw:focus{outline:0}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font-size:22px;font-weight:800;margin:32px 0 14px;letter-spacing:-.02em}
h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
h4{font-size:14px;font-weight:700}
p{color:var(--mut);font-size:13px}
h4,.card p,.ar p,.tr p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.skip{position:fixed;left:12px;top:-70px;z-index:100;padding:10px 16px;border-radius:99px;background:var(--ac);color:var(--on);font-weight:700}.skip:focus{top:12px}
.gl{background:var(--gl);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--bd)}
.aur i{position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);opacity:.28;z-index:-1;animation:fl 20s ease-in-out infinite alternate}
.aur i:nth-child(1){background:hsl(var(--th,165) 85% 55%);transition:background 1.2s;top:-20vmax;left:-10vmax}

.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,185px);gap:14px;overflow-x:auto;padding:6px 2px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
